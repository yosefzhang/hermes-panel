[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-panel"
version = "0.1.1"
description = "Web control panel for Hermes Agent configuration."
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.4.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "ruamel.yaml>=0.18.6",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# 所有测试产生的缓存与临时文件都限定在 test 目录内，避免污染项目根或用户真实配置目录。
cache_dir = "backend/tests/.pytest_cache"
# --basetemp 让 tmp_path/tmp_path_factory 的临时文件也落在 test 目录内（需在项目根运行）。
addopts = "--basetemp=backend/tests/.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["frontend*"]

[tool.setuptools.package-data]
backend = ["hermes_provider_registry.json"]