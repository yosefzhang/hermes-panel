services:
  hermes-panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-panel:latest
    container_name: hermes-panel
    network_mode: bridge
    restart: unless-stopped
    ports:
      - "0.0.0.0:9082:8090"
    environment:
      TZ: Asia/Shanghai
    env_file:
      - .env
    volumes:
      # Hermes 数据目录（hermes_path，默认 ~/.hermes；容器内 root 用户即 /root/.hermes）
      - /vol1/1000/app/hermes:/root/.hermes
      # 面板自身的持久化数据（config.yaml / JSON 数据 / 日志 / 账号 / provider 注册表；
      # 容器内 /app/data）。config.yaml 也在此目录下（/app/data/config.yaml），
      # 首次启动自动生成，无需单独挂载文件。
      - ./data:/app/data